<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Admin - HAZE.420</title>
<link rel="stylesheet" href="style.css">
<style>
body { font-family: Arial; background: #f5f5f5; padding: 20px; }
.container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
button { padding: 10px; background: #b77b63; color: #fff; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { padding: 10px; border: 1px solid #ccc; text-align: center; }
a { color: #b77b63; text-decoration: none; }
</style>
</head>
<body>

<div class="container">
    <h2>Product Management</h2>

    <form id="productForm">
        <input type="hidden" id="productId">
        <input type="text" id="productName" placeholder="Product Name" required>
        <input type="number" id="productPrice" placeholder="Price" required>
        <input type="text" id="productImage" placeholder="Image URL" required>
        <select id="productCategory" required>
            <option value="" disabled selected>Select Category</option>
            <option value="women">Women</option>
            <option value="men">Men</option>
        </select>
        <button type="submit" id="saveBtn">Add Product</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Category</th>
                <th>Image</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="productTableBody"></tbody>
    </table>

    <p><a href="index.html">⬅ Back to Home</a></p>
</div>

<script>
// Load products from localStorage
let products = JSON.parse(localStorage.getItem('products')) || [];

// References
const form = document.getElementById('productForm');
const tableBody = document.getElementById('productTableBody');
const saveBtn = document.getElementById('saveBtn');

// Display products in table
function displayProducts(){
    tableBody.innerHTML = '';
    products.forEach((p, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${p.name}</td>
            <td>$${p.price}</td>
            <td>${p.category}</td>
            <td><img src="${p.image}" width="50"></td>
            <td>
                <button onclick="editProduct(${index})">Edit</button>
                <button onclick="deleteProduct(${index})">Delete</button>
            </td>
        `;
        tableBody.appendChild(row);
    });
}
displayProducts();

// Add or Update Product
form.addEventListener('submit', e => {
    e.preventDefault();
    const id = document.getElementById('productId').value;
    const productData = {
        name: document.getElementById('productName').value,
        price: parseFloat(document.getElementById('productPrice').value),
        image: document.getElementById('productImage').value,
        category: document.getElementById('productCategory').value
    };

    if(id === '') {
        // Add new product
        productData.id = products.length ? products[products.length - 1].id + 1 : 1;
        products.push(productData);
    } else {
        // Update existing product
        products[id] = { ...products[id], ...productData };
    }

    localStorage.setItem('products', JSON.stringify(products));
    displayProducts();
    form.reset();
    saveBtn.textContent = 'Add Product';
    document.getElementById('productId').value = '';
});

// Edit product
function editProduct(index){
    const p = products[index];
    document.getElementById('productId').value = index;
    document.getElementById('productName').value = p.name;
    document.getElementById('productPrice').value = p.price;
    document.getElementById('productImage').value = p.image;
    document.getElementById('productCategory').value = p.category;
    saveBtn.textContent = 'Update Product';
}

// Delete product
function deleteProduct(index){
    if(confirm('Delete this product?')){
        products.splice(index, 1);
        localStorage.setItem('products', JSON.stringify(products));
        displayProducts();
    }
}
</script>

</body>
</html>
